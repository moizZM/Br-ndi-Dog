<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brändi Dog Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
        }
        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .board {
            position: relative;
            width: 400px;
            height: 400px;
            background-color: #f3f3f3;
            border-radius: 50%;
            border: 3px solid #333;
        }
        .cell {
            position: absolute;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .piece {
            font-weight: bold;
            color: red;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
        }
        .player {
            margin: 10px;
        }
    </style>
</head>
<body>
    <h2>Brändi Dog Game</h2>
    <p>Player <span id="turn">1</span>'s turn</p>
    <p>Click a card to play:</p>
    <div class="player" id="cards-container">
        <!-- Cards will be displayed here dynamically -->
    </div>

    <h3>Game Board</h3>
    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <p id="status">Waiting for action...</p>

    <script>
        const players = ["Player 1", "Player 2", "Player 3", "Player 4"];
        const deck = (['Ace', 'King', 'Queen', 'Jack', 'Joker'] +
            [2, 3, 4, 5, 6, 7, 8, 9, 10].map(String)) * 4; // Full deck
        let gameState = {
            turn: 1, 
            positions: {1: 0, 2: 0, 3: 0, 4: 0},
            cards: {1: [], 2: [], 3: [], 4: []},
            finished: {1: false, 2: false, 3: false, 4: false}
        };

        // Custom shuffle function
        function shuffle(deck) {
            for (let i = deck.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        // Shuffle and distribute cards
        function shuffleAndDistribute() {
            let shuffledDeck = shuffle([...deck]);
            for (let i = 1; i <= 4; i++) {
                gameState.cards[i] = shuffledDeck.splice(0, 6);
            }
        }

        // Generate game cards HTML
        function generateCards() {
            const cardContainer = document.getElementById('cards-container');
            const playerCards = gameState.cards[gameState.turn];
            cardContainer.innerHTML = "";
            playerCards.forEach(card => {
                let button = document.createElement('button');
                button.innerText = card;
                button.onclick = () => playCard(card);
                cardContainer.appendChild(button);
            });
        }

        // Play card function
        function playCard(card) {
            const player = gameState.turn;
            if (gameState.cards[player].includes(card)) {
                gameState.cards[player] = gameState.cards[player].filter(c => c !== card);
                gameState.positions[player] += card === "Ace" ? 1 : (parseInt(card) || 1);

                if (gameState.positions[player] >= 40) {
                    gameState.finished[player] = true;
                    document.getElementById('status').innerText = `${players[player - 1]} wins!`;
                } else {
                    gameState.turn = (gameState.turn % 4) + 1;
                    document.getElementById('turn').innerText = gameState.turn;
                }
                generateCards();
                updateBoard();
            } else {
                alert("Invalid card!");
            }
        }

        // Generate board positions
        function generateBoard() {
            const board = document.getElementById('board');
            let positions = [];
            for (let i = 0; i < 40; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                let x = 200 + 100 * Math.cos((i / 40) * 2 * Math.PI);
                let y = 200 + 100 * Math.sin((i / 40) * 2 * Math.PI);
                cell.style.left = `${x}px`;
                cell.style.top = `${y}px`;
                board.appendChild(cell);
            }
        }

        // Update board state
        function updateBoard() {
            const boardCells = document.querySelectorAll('.cell');
            boardCells.forEach(cell => cell.innerHTML = '');
            for (let player in gameState.positions) {
                let pos = gameState.positions[player] % 40;
                let cell = boardCells[pos];
                if (cell) {
                    cell.innerHTML = `<span class="piece">P${player}</span>`;
                }
            }
        }

        // Initialize game
        function startGame() {
            shuffleAndDistribute();
            generateCards();
            generateBoard();
            updateBoard();
        }

        startGame();
    </script>
</body>
</html>
