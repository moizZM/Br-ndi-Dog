<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brändi Dog Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 50px);
            grid-gap: 10px;
            margin: 50px auto;
            width: 600px;
            height: 600px;
        }
        .cell {
            width: 50px;
            height: 50px;
            background-color: #f4f4f4;
            border: 1px solid #333;
            position: relative;
        }
        .marble {
            width: 30px;
            height: 30px;
            background-color: #ff6347;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        button {
            margin: 20px;
        }
    </style>
</head>
<body>

    <h1>Brändi Dog Game</h1>
    <p>Click a marble to move!</p>
    
    <div class="board" id="board">
        <!-- Cells will be created here dynamically -->
    </div>
    
    <button onclick="moveMarble(1)">Move Marble 1</button>
    <button onclick="moveMarble(2)">Move Marble 2</button>
    <button onclick="moveMarble(3)">Move Marble 3</button>
    <button onclick="moveMarble(4)">Move Marble 4</button>
    
    <script>
        // Game board setup
        const board = document.getElementById("board");
        const boardSize = 10;
        let marbles = [0, 1, 2, 3]; // Initial marble positions

        // Create board grid cells
        for (let i = 0; i < boardSize * boardSize; i++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");
            cell.id = "cell-" + i;
            board.appendChild(cell);
        }

        // Place marbles
        function placeMarbles() {
            const cells = document.querySelectorAll(".cell");
            marbles.forEach((position, index) => {
                const cell = cells[position];
                const marble = document.createElement("div");
                marble.classList.add("marble");
                marble.id = "marble-" + index;
                cell.appendChild(marble);
            });
        }

        // Move a marble
        function moveMarble(marbleIndex) {
            const newPosition = marbles[marbleIndex] + 1; // Just an example to move one step
            if (newPosition < boardSize * boardSize) {
                marbles[marbleIndex] = newPosition;
                updateBoard();
            }
        }

        // Update board after a move
        function updateBoard() {
            const cells = document.querySelectorAll(".cell");
            cells.forEach(cell => cell.innerHTML = ""); // Clear all cells
            placeMarbles();
        }

        placeMarbles();
    </script>
</body>
</html>
